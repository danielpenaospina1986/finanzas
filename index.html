function anBuild(qList){
var rub={};
function ensure(n,c){if(!rub[n])rub[n]={n:n,c:c,vals:qList.map(function(){return 0}),total:0};if(c&&!rub[n].c)rub[n].c=c;return rub[n]}
qList.forEach(function(qi,qi_i){var rate=anRate(qi);
if(D.qPagos[qi.key])oe(D.qPagos[qi.key]).forEach(function(p){var isU=(p[1].moneda||"COP")==="USD";if(isU&&!rate)return;var amt=isU?p[1].monto*rate:p[1].monto;var parts=p[0].split("_");var src=parts[0];var srcId=parts.slice(1).join("_");if(src==="fijo"){var nm=(D.fijos[srcId]&&D.fijos[srcId].n)||"Fijo eliminado";var r=ensure(nm,null);r.grp="fijo";r.vals[qi_i]+=amt;r.total+=amt}else if(src==="deuda"){var nm=(D.deudas[srcId]&&D.deudas[srcId].n)||"Deuda eliminada";var r=ensure(nm,null);r.grp="deuda";r.vals[qi_i]+=amt;r.total+=amt}});
oe(D.itinerantes).forEach(function(x){if(!anInQ(x[1].fecha,qi))return;var isU=x[1].moneda==="USD";if(isU&&!rate)return;var amt=isU?x[1].monto*rate:x[1].monto;var r=ensure(x[1].subcat||"General",null);r.vals[qi_i]+=amt;r.total+=amt});
oe(D.imprevistos).forEach(function(x){if(!anInQ(x[1].fecha,qi))return;var isU=x[1].moneda==="USD";if(isU&&!rate)return;var amt=isU?x[1].monto*rate:x[1].monto;var r=ensure("Imprevistos","var(--orange)");r.grp="imp";r.vals[qi_i]+=amt;r.total+=amt})});
var arr=Object.keys(rub).map(function(k){return rub[k]});var pi=0;
arr.forEach(function(r){if(!r.c){r.c=SUBCL[pi%SUBCL.length];pi++}});
function grpRank(r){return r.grp==="fijo"?0:r.grp==="deuda"?1:r.grp==="imp"?2:3}
arr.sort(function(a,b){var ra=grpRank(a),rb=grpRank(b);if(ra!==rb)return ra-rb;return b.total-a.total});

function buildCL(qi){
var items=[];
oe(D.fijos).forEach(function(x){var f=x[1];var v=payDateInQ(f.dia,qi);if(!v)return;var t=f.mult||1;for(var i=0;i<t;i++){items.push({src:"fijo",srcId:x[0],n:f.n+(t>1?" ("+(i+1)+")":""),m:f.m,mon:"COP",vence:v,pri:0,tipo:"fijo"})}});
oe(D.deudas).forEach(function(x){var d=x[1];if(d.saldo===0)return;if(d.contado){if(d.fechaPagoTotal){var fp=new Date(d.fechaPagoTotal+"T00:00:00");if(fp.getMonth()===qi.month&&fp.getDate()>=qi.startDay&&fp.getDate()<=qi.endDay){items.push({src:"deuda",srcId:x[0],n:d.n+" (contado)",m:d.saldo||0,mon:d.usd?"USD":"COP",vence:d.fechaPagoTotal,pri:0,tipo:"deuda",saldo:d.saldo,usd:d.usd})}}return}if(!d.cuota||d.cuota<=0)return;var v=payDateInQ(d.dia,qi);if(!v)return;items.push({src:"deuda",srcId:x[0],n:d.n,m:d.cuota,mon:d.usd?"USD":"COP",vence:v,pri:0,tipo:"deuda",saldo:d.saldo,cupoDisp:d.cupoDisp,usd:d.usd})});
oe(D.itinerantes).forEach(function(x){var it=x[1];if(it.pagado)return;var venceDate=it.vence||it.fecha;if(!venceDate)return;var vd=new Date(venceDate+"T00:00:00");var now2=new Date();now2.setHours(0,0,0,0);var isOverdue=vd<now2;var inThisQ=vd.getMonth()===qi.month&&vd.getFullYear()===qi.year&&vd.getDate()>=qi.startDay&&vd.getDate()<=qi.endDay;var currentQ=qInfo();var isCurrentQ=qi.key===currentQ.key;if(inThisQ||(isOverdue&&isCurrentQ)){items.push({src:"it",srcId:x[0],n:it.desc,m:it.monto,mon:it.moneda||"COP",vence:venceDate,pri:2,tipo:"itinerante",debeA:it.debeA})}});
oe(D.imprevistos).forEach(function(x){var im=x[1];if(im.pagado)return;var venceDate=im.vence||im.fecha;if(!venceDate)return;var vd=new Date(venceDate+"T00:00:00");var now2=new Date();now2.setHours(0,0,0,0);var isOverdue=vd<now2;var inThisQ=vd.getMonth()===qi.month&&vd.getFullYear()===qi.year&&vd.getDate()>=qi.startDay&&vd.getDate()<=qi.endDay;var currentQ=qInfo();var isCurrentQ=qi.key===currentQ.key;if(inThisQ||(isOverdue&&isCurrentQ)){items.push({src:"imp",srcId:x[0],n:im.desc,m:im.monto,mon:im.moneda||"COP",vence:venceDate,pri:1,tipo:"imprevisto",debeA:im.debeA})}});
items.forEach(function(it){var pk=it.src+"_"+it.srcId;if(D.qPagos[qi.key]&&D.qPagos[qi.key][pk]){it.pagado=true;it.montoReal=D.qPagos[qi.key][pk].monto;it.medioPago=D.qPagos[qi.key][pk].medio;it.monPagado=D.qPagos[qi.key][pk].moneda||it.mon}});
var nc={};items.filter(function(x){return!x.pagado}).forEach(function(x){var b=x.n.replace(/\s*\(.*\)/,"").toLowerCase().trim();nc[b]=(nc[b]||0)+1});
items.forEach(function(x){if(x.pagado)return;var b=x.n.replace(/\s*\(.*\)/,"").toLowerCase().trim();if(b.indexOf("manutencion")>=0)x.pri=0;else if(nc[b]>1)x.pri=0});
items.sort(function(a,b){if(a.pagado!==b.pagado)return a.pagado?1:-1;return a.pri!==b.pri?a.pri-b.pri:(a.vence||"z").localeCompare(b.vence||"z")});
return{items:items,accum:Object.keys(nc).filter(function(k){return nc[k]>1})}
}

// Collect unpaid fijos/deudas from past quincenas (itinerantes/imprevistos vencidos ya entran en la quincena actual via buildCL).
// Una quincena pasada se revisa si es la inmediatamente anterior, o si ya tiene algun pago registrado (evita inundar con meses previos al uso de la app).
function buildPast(){
var out=[];
for(var off=-1;off>=-12;off--){var qi=qInfoAt(off);var hasPagos=D.qPagos[qi.key]&&Object.keys(D.qPagos[qi.key]).length>0;if(off!==-1&&!hasPagos)continue;var cl=buildCL(qi);cl.items.forEach(function(it){if(it.pagado)return;if(it.src!=="fijo"&&it.src!=="deuda")return;it.qLabel=qi.label;out.push(it)})}
out.sort(function(a,b){return(a.vence||"z").localeCompare(b.vence||"z")});
return out}

function ingAvg(){
var all=oe(D.ingresos).sort(function(a,b){return(a[1].fecha||"").localeCompare(b[1].fecha||"")});
var byQ={};all.forEach(function(x){var d=new Date(x[1].fecha+"T00:00:00");var q=qInfo(d);if(!byQ[q.key])byQ[q.key]=[];byQ[q.key].push(x[1])});
var copS=[],usdS=[];
Object.values(byQ).forEach(function(arr){var normal=arr.filter(function(x){return!x.esExtra}).slice(0,2);copS.push(normal.filter(function(x){return x.moneda!=="USD"}).reduce(function(s,x){return s+x.monto},0));usdS.push(normal.filter(function(x){return x.moneda==="USD"}).reduce(function(s,x){return s+x.monto},0))});
if(!copS.length)return{cop:0,usd:0};
return{cop:Math.round(copS.reduce(function(s,x){return s+x},0)/copS.length),usd:parseFloat((usdS.reduce(function(s,x){return s+x},0)/usdS.length).toFixed(2))}
}

async function confirmPay(src,srcId,vence,mon,isD){
var monto=parseFloat(document.getElementById("piM").value)||0;var medio=document.getElementById("piMed").value;if(!monto)return toast("Monto");
var qi=qInfo(new Date(vence+"T00:00:00"));var pk=src+"_"+srcId;
if(!D.qPagos[qi.key])D.qPagos[qi.key]={};
D.qPagos[qi.key][pk]={monto:monto,medio:medio,moneda:mon,fecha:new Date().toISOString().slice(0,10)};
await fb("PUT","qPagos/"+qi.key+"/"+pk,D.qPagos[qi.key][pk]);
if(isD&&document.getElementById("piSaldo")){var s=parseFloat(document.getElementById("piSaldo").value);if(!isNaN(s)){D.deudas[srcId].saldo=s;D.deudas[srcId].conf=true;var mk=new Date().toISOString().slice(0,7);if(!D.deudas[srcId].hist)D.deudas[srcId].hist={};D.deudas[srcId].hist[mk]=s;await fb("PUT","deudas/"+srcId+"/hist/"+mk,s);await sv("deudas/"+srcId,{saldo:s,conf:true})}if(document.getElementById("piCupo")){var c=parseFloat(document.getElementById("piCupo").value);if(!isNaN(c))await sv("deudas/"+srcId,{cupoDisp:c})}}
if(src==="it"){D.itinerantes[srcId].pagado=true;await sv("itinerantes/"+srcId,{pagado:true})}
if(src==="imp"){D.imprevistos[srcId].pagado=true;await sv("imprevistos/"+srcId,{pagado:true})}
cls();toast("Pagado: "+fV(monto,mon));render()
}
function undoPay(src,srcId,vence){var qi=qInfo(new Date(vence+"T00:00:00"));var pk=src+"_"+srcId;if(D.qPagos[qi.key])delete D.qPagos[qi.key][pk];fb("DELETE","qPagos/"+qi.key+"/"+pk);toast("Desmarcado");render()}

// ===== ACCESO: Google Identity Services + Face ID (WebAuthn) =====
var appStarted=false;
var GBTN_P='width:100%;padding:14px 18px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(180deg,#5bdd72,#34c759);border:none;border-radius:16px;cursor:pointer;font-family:inherit;box-shadow:0 8px 24px rgba(52,199,89,.35),inset 0 .8px 0 rgba(255,255,255,.5)';
var GBTN_S='width:100%;padding:12px 18px;font-size:14px;font-weight:500;color:#007aff;background:rgba(255,255,255,.55);border:none;border-radius:14px;cursor:pointer;font-family:inherit';
var webauthnOK=(typeof window.PublicKeyCredential!=='undefined');
function gateHTML(x){var g=document.getElementById('gateArea');if(g)g.innerHTML=x}
function hideSplash(){var s=document.getElementById('splash');if(!s)return;s.style.opacity='0';setTimeout(function(){s.style.display='none'},420)}
function faceCredId(){return localStorage.getItem('mylukas_faceid')}
function _b2b64(b){return btoa(String.fromCharCode.apply(null,new Uint8Array(b)))}
function _b642b(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
function _chal(){var u=new Uint8Array(32);crypto.getRandomValues(u);return u}
function acctHTML(){var u=auth&&auth.currentUser;var x='';x+='<div class="r" style="cursor:default"><div class="rb"><div class="rt">'+(u?(u.displayName||u.email||'Cuenta'):'—')+'</div><div class="rs">'+(u?(u.email||''):'Sin sesion')+'</div></div></div>';if(webauthnOK){if(faceCredId())x+='<div class="r" onclick="faceDisable()"><div class="rb"><div class="rt">Face ID</div><div class="rs">Activado · toca para desactivar</div></div><div class="pill" style="background:var(--green);color:#fff">ON</div></div>';else x+='<div class="r" onclick="faceRegister()"><div class="rb"><div class="rt">Activar Face ID</div><div class="rs">Desbloqueo biometrico al abrir</div></div><div class="pill" style="background:var(--blue);color:#fff">Activar</div></div>'}x+='<div class="r" onclick="doLogout()"><div class="rb"><div class="rt" style="color:var(--red)">Cerrar sesion</div></div></div>';return x}
async function enterApp(){if(appStarted)return;appStarted=true;await init();hideSplash()}
async function faceUnlock(){gateHTML('<div style="color:#8a8a8f;font-size:14px;padding:8px">Verificando Face ID…</div>');try{await navigator.credentials.get({publicKey:{challenge:_chal(),allowCredentials:[{type:'public-key',id:_b642b(faceCredId())}],userVerification:'required',timeout:60000}});await enterApp()}catch(e){gateHTML('<button id="gRe" style="'+GBTN_P+'">Reintentar Face ID</button><button id="gSk" style="'+GBTN_S+'">Entrar sin Face ID</button>');var a=document.getElementById('gRe'),b=document.getElementById('gSk');if(a)a.onclick=faceUnlock;if(b)b.onclick=enterApp}}
async function faceRegister(){if(!webauthnOK)return toast('Dispositivo sin soporte Face ID');if(!auth||!auth.currentUser)return toast('Inicia sesion primero');try{var u=auth.currentUser;var cred=await navigator.credentials.create({publicKey:{challenge:_chal(),rp:{name:'MyLukas'},user:{id:new TextEncoder().encode(u.uid),name:u.email||'mylukas',displayName:u.displayName||'MyLukas'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000,attestation:'none'}});localStorage.setItem('mylukas_faceid',_b2b64(cred.rawId));toast('Face ID activado');render()}catch(e){toast('No se pudo activar Face ID')}}
function faceDisable(){localStorage.removeItem('mylukas_faceid');toast('Face ID desactivado');render()}
function doLogout(){try{if(auth)auth.signOut()}catch(e){}try{if(window.google&&google.accounts&&google.accounts.id)google.accounts.id.disableAutoSelect()}catch(e){}localStorage.removeItem('mylukas_faceid');location.reload()}
function whenGIS(cb,n){n=n||0;if(window.google&&google.accounts&&google.accounts.id)return cb();if(n>60){gateHTML('<div style="color:#ff3b30;font-size:13px;text-align:center">No se pudo cargar Google. Revisa la conexion y reabre la app.</div>');return}setTimeout(function(){whenGIS(cb,n+1)},120)}
var _gisInit=false;
async function onGoogleCred(resp){gateHTML('<div style="color:#8a8a8f;font-size:14px;padding:8px">Conectando…</div>');try{var cred=firebase.auth.GoogleAuthProvider.credential(resp.credential);await auth.signInWithCredential(cred)}catch(e){showLogin('No se pudo iniciar sesion'+(e&&e.code?' ('+e.code+')':''))}}
function showLogin(msg){gateHTML((msg?'<div style="color:#ff3b30;font-size:12px;margin-bottom:6px;text-align:center">'+msg+'</div>':'')+'<div id="gsiBtn" style="display:flex;justify-content:center;min-height:44px"></div><div style="color:#8a8a8f;font-size:11px;text-align:center;margin-top:8px">Acceso privado a tus finanzas</div>');whenGIS(function(){try{if(!_gisInit){google.accounts.id.initialize({client_id:GCLIENT,callback:onGoogleCred,auto_select:false,cancel_on_tap_outside:false});_gisInit=true}google.accounts.id.renderButton(document.getElementById('gsiBtn'),{type:'standard',theme:'filled_blue',size:'large',shape:'pill',text:'continue_with',width:280,logo_alignment:'center'})}catch(e){gateHTML('<div style="color:#ff3b30;font-size:13px;text-align:center">Error iniciando Google: '+(e.message||e)+'</div>')}})}
async function boot(){if(!auth){showLogin('No se pudo cargar Firebase');return}auth.onAuthStateChanged(async function(user){if(appStarted)return;if(!user){showLogin('');return}if(webauthnOK&&faceCredId()){faceUnlock()}else{await enterApp()}})}
boot();
</script>
